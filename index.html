<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pogemon GO - AR Pokémon Adventure</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            pointer-events: none;
        }
        
        .ui-element {
            pointer-events: auto;
        }
        
        .top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 20px;
            color: white;
            backdrop-filter: blur(10px);
        }
        
        .catch-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(255,107,107,0.5);
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }
        
        .catch-button:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 30px rgba(255,107,107,0.8);
        }
        
        .catch-button.visible {
            display: block;
        }
        
        .pokemon-list {
            position: absolute;
            top: 100px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        
        .pokemon-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
        }
        
        .pokemon-image {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            border: 2px solid #fff;
        }
        
        .pokemon-stats {
            flex: 1;
        }
        
        .pokemon-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .pokemon-type {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .notification.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div class="top-bar ui-element">
            <div>
                <div>Pogemon GO</div>
                <div id="location-info" style="font-size: 12px; opacity: 0.8;"></div>
            </div>
            <div>
                <span id="pokemon-count">Caught: 0</span>
            </div>
        </div>
        
        <button id="catch-button" class="catch-button ui-element">
            CATCH!
        </button>
        
        <div id="loading" class="loading ui-element">
            <div class="spinner"></div>
            <div>Initializing AR Camera...</div>
        </div>
        
        <div id="notification" class="notification ui-element"></div>
    </div>

    <a-scene
        id="ar-scene"
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;">
        
        <a-assets>
            <a-asset-item id="pokeball" src="data:model/gltf+json;base64,eyJ..."></a-asset-item>
        </a-assets>
        
        <a-camera id="ar-camera" gps-camera rotation-reader></a-camera>
        
        <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
        <a-light type="directional" color="#ffffff" intensity="1" position="0 5 0"></a-light>
    </a-scene>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Initialize WebsimSocket with comprehensive error handling
        let room = null;
        let websimAvailable = false;
        
        try {
            if (typeof WebsimSocket !== 'undefined') {
                room = new WebsimSocket();
                websimAvailable = true;
                console.log('WebsimSocket initialized successfully');
            } else {
                console.warn('WebsimSocket not available - using fallback mode');
            }
        } catch (error) {
            console.error('Failed to initialize WebsimSocket:', error);
            room = null;
        }
        
        // Check if websim services are available
        try {
            websimAvailable = websimAvailable && typeof websim !== 'undefined' && websim.imageGen;
        } catch (error) {
            console.warn('Websim services not available - using fallback images');
            websimAvailable = false;
        }
        
        // Pokémon generation utilities
        const pokemonTypes = ['Fire', 'Water', 'Grass', 'Electric', 'Psychic', 'Ice', 'Dragon', 'Flying', 'Ghost', 'Fighting'];
        const pokemonNamePrefixes = ['Pika', 'Char', 'Bulba', 'Squir', 'Jiggly', 'Psyd', 'Mew', 'Eev', 'Drago', 'Volt'];
        const pokemonNameSuffixes = ['mon', 'chu', 'saur', 'tle', 'puff', 'duck', 'two', 'ee', 'nite', 'orb'];
        
        // Fallback Pokemon images
        const fallbackPokemonImages = [
            'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png',
            'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png',
            'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png',
            'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png',
            'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/150.png'
        ];
        
        function generatePokemonName() {
            const prefix = pokemonNamePrefixes[Math.floor(Math.random() * pokemonNamePrefixes.length)];
            const suffix = pokemonNameSuffixes[Math.floor(Math.random() * pokemonNameSuffixes.length)];
            return prefix + suffix;
        }
        
        function generatePokemonStats() {
            return {
                hp: Math.floor(Math.random() * 100) + 50,
                attack: Math.floor(Math.random() * 100) + 30,
                defense: Math.floor(Math.random() * 100) + 30,
                speed: Math.floor(Math.random() * 100) + 20
            };
        }
        
        async function generatePokemon() {
            const name = generatePokemonName();
            const type = pokemonTypes[Math.floor(Math.random() * pokemonTypes.length)];
            const stats = generatePokemonStats();
            
            let imageUrl = fallbackPokemonImages[Math.floor(Math.random() * fallbackPokemonImages.length)];
            
            // Try to generate AI image if websim is available
            if (websimAvailable) {
                try {
                    const imageResult = await websim.imageGen({
                        prompt: `A cute cartoon ${type.toLowerCase()} type pokemon creature called ${name}, colorful, friendly, anime style, transparent background`,
                        transparent: true,
                        aspect: "square"
                    });
                    
                    if (imageResult && imageResult.url) {
                        imageUrl = imageResult.url;
                    }
                } catch (error) {
                    console.error('Failed to generate AI image:', error);
                    // Will use fallback image
                }
            }
            
            const pokemonData = {
                name,
                type,
                stats,
                image_url: imageUrl,
                rarity: Math.random() < 0.1 ? 'rare' : Math.random() < 0.3 ? 'uncommon' : 'common'
            };
            
            // Try to save to database if room is available
            if (room) {
                try {
                    const pokemon = await room.collection('pokemon').create(pokemonData);
                    return pokemon;
                } catch (error) {
                    console.error('Failed to save pokemon to database:', error);
                }
            }
            
            // Return pokemon data even if database save fails
            return {
                ...pokemonData,
                id: Date.now() + Math.random() // Generate a temporary ID
            };
        }
        
        // GPS and spawn utilities
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the earth in km
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const d = R * c; // Distance in km
            return d;
        }
        
        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }
        
        function generateSpawnLocation(centerLat, centerLon, radiusKm = 0.1) {
            const y0 = centerLat;
            const x0 = centerLon;
            const rd = radiusKm / 111.32; // Convert km to degrees
            
            const u = Math.random();
            const v = Math.random();
            const w = rd * Math.sqrt(u);
            const t = 2 * Math.PI * v;
            const x = w * Math.cos(t);
            const y = w * Math.sin(t);
            
            return {
                lat: y + y0,
                lon: x + x0
            };
        }
        
        // Main App Component
        function App() {
            const [userPosition, setUserPosition] = useState(null);
            const [nearbyPokemon, setNearbyPokemon] = useState([]);
            const [caughtPokemon, setCaughtPokemon] = useState([]);
            const [currentTarget, setCurrentTarget] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [notification, setNotification] = useState('');
            const [locationInfo, setLocationInfo] = useState('');
            const [localPokemon, setLocalPokemon] = useState([]); // Fallback local storage
            const sceneRef = useRef(null);
            
            // Get all Pokémon from database with error handling
            let allPokemon = [];
            try {
                if (room && room.collection) {
                    const pokemonCollection = room.collection('pokemon');
                    if (pokemonCollection && pokemonCollection.getList) {
                        allPokemon = React.useSyncExternalStore(
                            (callback) => {
                                try {
                                    return pokemonCollection.subscribe(callback);
                                } catch (error) {
                                    console.error('Error subscribing to pokemon collection:', error);
                                    return () => {};
                                }
                            },
                            () => {
                                try {
                                    return pokemonCollection.getList() || [];
                                } catch (error) {
                                    console.error('Error getting pokemon list:', error);
                                    return [];
                                }
                            }
                        );
                    }
                }
            } catch (error) {
                console.error('Error accessing pokemon collection:', error);
                allPokemon = [];
            }
            
            // Use local pokemon if database is not available
            if (!Array.isArray(allPokemon) || allPokemon.length === 0) {
                allPokemon = localPokemon || [];
            }
            
            // Get user's caught Pokémon with error handling
            let userCaught = [];
            try {
                if (room && room.collection) {
                    const caughtCollection = room.collection('caught_pokemon');
                    if (caughtCollection && caughtCollection.getList) {
                        userCaught = React.useSyncExternalStore(
                            (callback) => {
                                try {
                                    return caughtCollection.subscribe(callback);
                                } catch (error) {
                                    console.error('Error subscribing to caught pokemon collection:', error);
                                    return () => {};
                                }
                            },
                            () => {
                                try {
                                    return caughtCollection.getList() || [];
                                } catch (error) {
                                    console.error('Error getting caught pokemon list:', error);
                                    return [];
                                }
                            }
                        );
                    }
                }
            } catch (error) {
                console.error('Error accessing caught pokemon collection:', error);
                userCaught = [];
            }
            
            // Use local storage as fallback
            if (!Array.isArray(userCaught) || userCaught.length === 0) {
                try {
                    const stored = localStorage.getItem('caughtPokemon');
                    if (stored) {
                        userCaught = JSON.parse(stored) || [];
                    }
                } catch (error) {
                    console.error('Error reading from localStorage:', error);
                    userCaught = [];
                }
            }
            
            useEffect(() => {
                initializeApp();
                
                // Set up catch button handler
                const catchButton = document.getElementById('catch-button');
                if (catchButton) {
                    catchButton.addEventListener('click', catchPokemon);
                }
                
                // Set up location watcher
                let watchId;
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition((position) => {
                        const locationInfoText = `Lat: ${position.coords.latitude.toFixed(4)}, Lon: ${position.coords.longitude.toFixed(4)}`;
                        setLocationInfo(locationInfoText);
                        
                        const locationEl = document.getElementById('location-info');
                        if (locationEl) {
                            locationEl.textContent = locationInfoText;
                        }
                    }, (error) => {
                        console.error('Location error:', error);
                        setNotification('Location access denied. Please enable location services.');
                    }, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    });
                }
                
                return () => {
                    if (watchId) {
                        navigator.geolocation.clearWatch(watchId);
                    }
                    if (catchButton) {
                        catchButton.removeEventListener('click', catchPokemon);
                    }
                };
            }, []);
            
            useEffect(() => {
                if (userPosition && allPokemon.length > 0) {
                    spawnNearbyPokemon();
                }
            }, [userPosition, allPokemon]);
            
            useEffect(() => {
                setCaughtPokemon(userCaught);
                
                // Update pokemon count in DOM
                const countEl = document.getElementById('pokemon-count');
                if (countEl) {
                    countEl.textContent = `Caught: ${Array.isArray(userCaught) ? userCaught.length : 0}`;
                }
            }, [userCaught]);
            
            useEffect(() => {
                const notificationEl = document.getElementById('notification');
                if (notificationEl && notification) {
                    notificationEl.textContent = notification;
                    notificationEl.classList.add('show');
                    
                    const timer = setTimeout(() => {
                        notificationEl.classList.remove('show');
                    }, 3000);
                    
                    return () => clearTimeout(timer);
                }
            }, [notification]);
            
            useEffect(() => {
                const loadingEl = document.getElementById('loading');
                if (loadingEl) {
                    loadingEl.style.display = isLoading ? 'block' : 'none';
                }
            }, [isLoading]);
            
            async function initializeApp() {
                try {
                    if (!navigator.geolocation) {
                        throw new Error('Geolocation is not supported by this browser');
                    }
                    
                    // Request location permission
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 60000
                        });
                    });
                    
                    setUserPosition({
                        lat: position.coords.latitude,
                        lon: position.coords.longitude
                    });
                    
                    // Wait for existing pokemon to load or generate new ones
                    setTimeout(async () => {
                        try {
                            let currentPokemon = [];
                            
                            // Try to get from database first
                            if (room && room.collection) {
                                try {
                                    const pokemonCollection = room.collection('pokemon');
                                    if (pokemonCollection && pokemonCollection.getList) {
                                        currentPokemon = pokemonCollection.getList() || [];
                                    }
                                } catch (error) {
                                    console.error('Error getting pokemon from database:', error);
                                    currentPokemon = [];
                                }
                            }
                            
                            // Generate local pokemon if database is empty or unavailable
                            if (!Array.isArray(currentPokemon) || currentPokemon.length < 5) {
                                const newPokemon = [];
                                for (let i = 0; i < 5; i++) {
                                    try {
                                        const pokemon = await generatePokemon();
                                        if (pokemon && pokemon.name) {
                                            newPokemon.push(pokemon);
                                        }
                                    } catch (error) {
                                        console.error('Error generating pokemon:', error);
                                    }
                                }
                                
                                // Store locally if database is not available
                                if (!room || newPokemon.length > 0) {
                                    setLocalPokemon(newPokemon);
                                }
                            }
                            
                            setIsLoading(false);
                            setNotification('AR Camera Ready! Look around to find Pokémon!');
                        } catch (error) {
                            console.error('Error initializing Pokemon:', error);
                            setIsLoading(false);
                            setNotification('App initialized with limited functionality. Some features may not work.');
                        }
                    }, 1000);
                    
                } catch (error) {
                    console.error('Error initializing app:', error);
                    setIsLoading(false);
                    setNotification('Please enable location access to play');
                }
            }
            
            function spawnNearbyPokemon() {
                if (!userPosition || !Array.isArray(allPokemon) || allPokemon.length === 0) return;
                
                // Generate 1-3 spawn locations near the user
                const spawnCount = Math.floor(Math.random() * 3) + 1;
                const spawns = [];
                
                for (let i = 0; i < spawnCount; i++) {
                    const spawnLocation = generateSpawnLocation(userPosition.lat, userPosition.lon);
                    const randomPokemon = allPokemon[Math.floor(Math.random() * allPokemon.length)];
                    
                    if (randomPokemon && randomPokemon.name) {
                        spawns.push({
                            ...randomPokemon,
                            spawnLat: spawnLocation.lat,
                            spawnLon: spawnLocation.lon,
                            distance: getDistanceFromLatLonInKm(
                                userPosition.lat, 
                                userPosition.lon, 
                                spawnLocation.lat, 
                                spawnLocation.lon
                            )
                        });
                    }
                }
                
                setNearbyPokemon(spawns);
                updateARScene(spawns);
            }
            
            function updateARScene(spawns) {
                const scene = document.querySelector('#ar-scene');
                if (!scene || !Array.isArray(spawns)) return;
                
                // Clear existing pokemon entities
                const existingPokemon = scene.querySelectorAll('.pokemon-entity');
                existingPokemon.forEach(entity => {
                    if (entity && entity.remove) {
                        entity.remove();
                    }
                });
                
                // Add new pokemon entities
                spawns.forEach((pokemon, index) => {
                    if (!pokemon || !pokemon.image_url || !pokemon.name) return;
                    
                    try {
                        const entity = document.createElement('a-entity');
                        entity.classList.add('pokemon-entity');
                        entity.setAttribute('id', `pokemon-${index}`);
                        
                        // Create image plane for the pokemon
                        const image = document.createElement('a-image');
                        image.setAttribute('src', pokemon.image_url);
                        image.setAttribute('width', '2');
                        image.setAttribute('height', '2');
                        image.setAttribute('position', `${(index - 1) * 3} 0 -5`);
                        image.setAttribute('look-at', '#ar-camera');
                        image.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 8000');
                        
                        // Add click handler
                        image.addEventListener('click', () => {
                            setCurrentTarget(pokemon);
                            const catchButton = document.getElementById('catch-button');
                            if (catchButton) {
                                catchButton.classList.add('visible');
                            }
                        });
                        
                        entity.appendChild(image);
                        scene.appendChild(entity);
                    } catch (error) {
                        console.error('Error creating pokemon entity:', error);
                    }
                });
            }
            
            async function catchPokemon() {
                if (!currentTarget || !currentTarget.name) return;
                
                try {
                    const caughtData = {
                        pokemon_id: currentTarget.id || Date.now(),
                        pokemon_name: currentTarget.name || 'Unknown',
                        pokemon_type: currentTarget.type || 'Normal',
                        pokemon_image: currentTarget.image_url || '',
                        caught_at: new Date().toISOString()
                    };
                    
                    // Try to save to database
                    if (room && room.collection) {
                        try {
                            const caughtCollection = room.collection('caught_pokemon');
                            if (caughtCollection && caughtCollection.create) {
                                await caughtCollection.create(caughtData);
                            }
                        } catch (error) {
                            console.error('Failed to save to database:', error);
                            // Save to localStorage as fallback
                            try {
                                const stored = localStorage.getItem('caughtPokemon');
                                const caughtList = stored ? JSON.parse(stored) : [];
                                caughtList.push(caughtData);
                                localStorage.setItem('caughtPokemon', JSON.stringify(caughtList));
                            } catch (storageError) {
                                console.error('Failed to save to localStorage:', storageError);
                            }
                        }
                    } else {
                        // Save to localStorage if room is not available
                        try {
                            const stored = localStorage.getItem('caughtPokemon');
                            const caughtList = stored ? JSON.parse(stored) : [];
                            caughtList.push(caughtData);
                            localStorage.setItem('caughtPokemon', JSON.stringify(caughtList));
                        } catch (error) {
                            console.error('Failed to save to localStorage:', error);
                        }
                    }
                    
                    setNotification(`Caught ${currentTarget.name}!`);
                    setCurrentTarget(null);
                    
                    const catchButton = document.getElementById('catch-button');
                    if (catchButton) {
                        catchButton.classList.remove('visible');
                    }
                    
                    // Respawn pokemon after catching
                    setTimeout(() => {
                        spawnNearbyPokemon();
                    }, 2000);
                    
                } catch (error) {
                    console.error('Error catching pokemon:', error);
                    setNotification('Failed to catch Pokémon. Try again!');
                }
            }
            
            function showNotification(message) {
                setNotification(message);
            }
            
            return null; // UI is handled by direct DOM manipulation
        }
        
        // Create a container for React and render the app
        const reactContainer = document.createElement('div');
        reactContainer.id = 'react-container';
        document.body.appendChild(reactContainer);
        
        // Initialize the app with error handling
        try {
            const root = ReactDOM.createRoot(reactContainer);
            root.render(<App />);
        } catch (error) {
            console.error('Failed to initialize React app:', error);
            document.getElementById('loading').innerHTML = '<div>Failed to initialize app. Please refresh the page.</div>';
        }
        
        // Hide loading when AR is ready
        window.addEventListener('camera-init', () => {
            const loadingEl = document.getElementById('loading');
            if (loadingEl) {
                loadingEl.style.display = 'none';
            }
        });
        
        // Add error handling for AR.js
        window.addEventListener('arjs-init', () => {
            console.log('AR.js initialized successfully');
        });
        
        // Handle AR.js errors
        window.addEventListener('error', (event) => {
            const errorMessage = event.error ? event.error.message || event.error.toString() : 'Unknown error';
            const errorStack = event.error ? event.error.stack : 'No stack trace available';
            
            console.error('Error occurred:', errorMessage);
            console.error('Stack trace:', errorStack);
            
            const notificationEl = document.getElementById('notification');
            if (notificationEl) {
                notificationEl.textContent = 'An error occurred. Please refresh the page.';
                notificationEl.classList.add('show');
            }
